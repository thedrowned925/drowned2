name: Deploy Drowned2 File Explorer

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "catalog.json"
      - "manifests/**"
      - "artwork/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R web/. _site/
          cp catalog.json _site/catalog.json
          mkdir -p _site/manifests _site/artwork
          if [ -d manifests ]; then cp -R manifests/. _site/manifests/; fi
          if [ -d artwork ]; then cp -R artwork/. _site/artwork/; fi
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
