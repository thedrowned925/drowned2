name: Fix Drowned2 repository references

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-drowned2-references.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace drowned1 runtime/test references with drowned2
        shell: python
        run: |
          from pathlib import Path

          roots = [Path('shared'), Path('windows'), Path('mobile'), Path('scripts'), Path('tests')]
          replacements = {
              'thedrowned925/drowned1': 'thedrowned925/drowned2',
              'github.com/thedrowned925/drowned1': 'github.com/thedrowned925/drowned2',
              'raw.githubusercontent.com/thedrowned925/drowned1': 'raw.githubusercontent.com/thedrowned925/drowned2',
              '"drowned1"': '"drowned2"',
              "'drowned1'": "'drowned2'",
          }

          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  try:
                      raw = path.read_bytes()
                      if b'\x00' in raw:
                          continue
                      text = raw.decode('utf-8')
                  except (OSError, UnicodeDecodeError):
                      continue

                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
                      changed.append(str(path))

          print(f'Updated {len(changed)} files:')
          for item in changed:
              print(' -', item)

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared windows mobile scripts tests
          if git diff --cached --quiet; then
            echo "No Drowned1 runtime references remain."
            exit 0
          fi
          git commit -m "Point Drowned2 runtime and tests at drowned2"
          git push origin HEAD:main
